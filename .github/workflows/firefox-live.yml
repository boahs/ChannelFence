name: Firefox live YouTube tests

on:
  schedule:
    - cron: "17 12 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  firefox-live:
    name: Firefox live YouTube checks (all supported languages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install fonts for all supported languages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Install stock Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Install matching Firefox language packs
        run: node scripts/install-firefox-locales.mjs
        env:
          CHANNELFENCE_FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
          CHANNELFENCE_FIREFOX_VERSION: ${{ steps.firefox.outputs.firefox-version }}
      - name: Build and lint Firefox package
        run: npm run build:firefox
      - name: Run all live YouTube checks in Firefox
        run: npm run test:firefox:live
        env:
          CHANNELFENCE_FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
      - name: Upload Firefox live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-live-report
          path: |
            firefox-playwright-report/
            firefox-test-results/
          if-no-files-found: ignore
          retention-days: 14
