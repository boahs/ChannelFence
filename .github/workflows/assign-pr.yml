name: Assign pull requests

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign:
    if: ${{ !contains(github.event.pull_request.assignees.*.login, 'boahs') }}
    runs-on: ubuntu-latest
    steps:
      - name: Assign boahs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" \
            -f 'assignees[]=boahs' \
            --silent
