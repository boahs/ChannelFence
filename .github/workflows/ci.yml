name: Chrome regression and shared checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Build website with GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build website
        uses: actions/jekyll-build-pages@v1

      - name: Verify changelog output
        run: test -s _site/changelog/index.html

      - name: Upload changelog preview
        uses: actions/upload-artifact@v4
        with:
          name: changelog-preview
          path: |
            _site/changelog/index.html
            _site/site/styles.css
            _site/assets/icons/channelfence-32.png
            _site/assets/icons/channelfence-48.png
          if-no-files-found: error
          retention-days: 14

  test:
    name: Chrome regressions, unit tests, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Chrome and Firefox scenario coverage
        run: node scripts/check-browser-coverage.mjs

      - name: Run all deterministic checks
        run: npm test

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
