name: Live YouTube Playwright tests

on:
  schedule:
    - cron: "17 0 * * *"
      timezone: "America/New_York"
    - cron: "17 12 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to validate manually (Chromium twice daily; Firefox daily)
        type: choice
        options: [chromium, firefox]
        default: chromium

permissions:
  contents: read

jobs:
  live-smoke:
    name: Chromium live YouTube checks (all supported languages)
    if: github.event_name == 'schedule' || inputs.browser != 'firefox'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all live YouTube Playwright tests
        run: npm run test:e2e:live

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-youtube-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  firefox-live:
    name: Firefox live YouTube checks
    if: (github.event_name == 'schedule' && github.event.schedule == '17 12 * * *') || (github.event_name == 'workflow_dispatch' && inputs.browser == 'firefox')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install fonts for live language screenshots
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: Install stock Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Build and lint Firefox package
        run: npm run build:firefox
      - name: Test English and Korean live YouTube
        run: npm run test:firefox:live
        env:
          CHANNELFENCE_FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
      - name: Upload Firefox live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-live-report
          path: |
            firefox-playwright-report/
            firefox-test-results/
          if-no-files-found: ignore
          retention-days: 14
