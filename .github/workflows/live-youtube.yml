name: Chrome live YouTube tests
run-name: Chrome live YouTube tests

on:
  schedule:
    - cron: "17 0,12 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      grep:
        description: Optional test-title filter; leave blank to run the complete suite
        type: string
        default: ""

permissions:
  contents: read

jobs:
  live-smoke:
    name: Chrome live YouTube checks (all supported languages)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live YouTube checks in Chrome
        run: npm run test:e2e:live -- --grep "$TEST_GREP"
        env:
          TEST_GREP: ${{ inputs.grep || '' }}

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-youtube-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
